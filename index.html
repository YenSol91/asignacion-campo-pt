<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asignación de Campo PT</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b5602f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --parchment: #f3ede2; --surface: #fffdf8; --surface-sunken: #ebe2cd;
    --ink: #2c2620; --ink-soft: #6c6252; --border: #ddd0af;
    --clay: #b5602f; --clay-dark: #7e3f1c; --clay-tint: #f2e0cd;
    --green: #4c7a4f; --green-tint: #e3ecdf;
    --amber: #a67a2a; --amber-tint: #f2e6c8;
    --rose: #ab4d3f; --rose-tint: #f4e0da; --sage: #8a8171;
    --shadow: 0 1px 2px rgba(44,38,32,.07), 0 10px 26px -14px rgba(44,38,32,.24);
    --radius: 10px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --parchment: #17140f; --surface: #201b14; --surface-sunken: #292219;
      --ink: #efe7d8; --ink-soft: #b3a892; --border: #3a3021;
      --clay: #e08a52; --clay-dark: #f0a978; --clay-tint: #362415;
      --green: #7cab7c; --green-tint: #212c1f;
      --amber: #d1a851; --amber-tint: #332c17;
      --rose: #d3776a; --rose-tint: #34211d; --sage: #a89a80;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --parchment: #17140f; --surface: #201b14; --surface-sunken: #292219;
    --ink: #efe7d8; --ink-soft: #b3a892; --border: #3a3021;
    --clay: #e08a52; --clay-dark: #f0a978; --clay-tint: #362415;
    --green: #7cab7c; --green-tint: #212c1f;
    --amber: #d1a851; --amber-tint: #332c17;
    --rose: #d3776a; --rose-tint: #34211d; --sage: #a89a80;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5; }
  h1,h2,h3{ font-family:"Zilla Slab", Georgia, serif; font-weight:600; letter-spacing:-0.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }

  .app{ display:grid; grid-template-columns:224px 1fr; min-height:100vh; }
  .sidebar{ background:var(--surface); border-right:1px solid var(--border); padding:24px 16px; display:flex; flex-direction:column; gap:26px; }
  .brand .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--sage); }
  .brand h1{ font-size:19px; margin-top:2px; }
  nav{ display:flex; flex-direction:column; gap:2px; }
  .navbtn{ display:flex; align-items:center; gap:10px; text-align:left; padding:9px 10px; border-radius:8px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13.5px; font-weight:500; }
  .navbtn:hover{ background:var(--surface-sunken); color:var(--ink); }
  .navbtn.active{ background:var(--clay-tint); color:var(--clay-dark); }
  .navbtn .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:none; }
  .sidebar-foot{ margin-top:auto; padding:10px 8px; font-size:11.5px; color:var(--sage); border-top:1px solid var(--border); padding-top:14px; }

  main{ padding:26px 32px 60px; max-width:1240px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .topbar h2{ font-size:23px; }
  .topbar .sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }

  .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:8px; padding:8px 14px; font-weight:500; font-size:13.5px; cursor:pointer; background:var(--clay); color:#fffaf3; }
  .btn:hover{ background:var(--clay-dark); }
  .btn.secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn.secondary:hover{ background:var(--surface-sunken); }
  .btn.danger{ background:transparent; color:var(--rose); }
  .btn.danger:hover{ background:var(--rose-tint); }
  .btn.small{ padding:4px 9px; font-size:12px; border-radius:6px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .sitetabs{ display:inline-flex; border:1px solid var(--border); border-radius:8px; padding:3px; background:var(--surface); gap:2px; }
  .sitetabs button{ border:none; background:transparent; padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer; }
  .sitetabs button.active{ background:var(--clay); color:#fffaf3; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }

  .toolrow{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolrow label{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .toolrow select, .toolrow input[type="date"], .toolrow input[type="month"]{ width:auto; }
  .search-box{ flex:1; min-width:160px; max-width:260px; }

  input[type="text"], input[type="date"], input[type="month"], select, textarea{ background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 9px; width:100%; }
  textarea{ resize:vertical; min-height:64px; }
  input:focus, select:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--clay); outline-offset:1px; }
  label{ font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; }
  .checkbox-row input{ width:auto; }

  .empty{ padding:44px 20px; text-align:center; color:var(--ink-soft); }
  .empty h3{ color:var(--ink); font-size:16px; margin-bottom:6px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:500; white-space:nowrap; }
  .pill.green{ background:var(--green-tint); color:var(--green); }
  .pill.amber{ background:var(--amber-tint); color:var(--amber); }
  .pill.rose{ background:var(--rose-tint); color:var(--rose); }
  .pill.idle{ background:var(--surface-sunken); color:var(--ink-soft); }
  .pill.clay{ background:var(--clay-tint); color:var(--clay-dark); }
  .casco-chip{ font-family:"IBM Plex Mono"; font-size:11px; color:var(--sage); }

  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--sage); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td{ padding:7px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-sunken); }
  .name-cell{ font-weight:500; }
  .muted{ color:var(--ink-soft); }

  .tbl-input{ padding:5px 7px; font-size:13px; min-width:150px; }
  .tbl-select{ padding:5px 7px; font-size:13px; width:auto; }
  .asig-cell{ display:flex; gap:6px; flex-wrap:wrap; }
  .asig-cell.oculto{ display:none; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(30,24,16,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow-y:auto; z-index:50; }
  .modal{ background:var(--surface); border-radius:14px; border:1px solid var(--border); width:100%; max-width:480px; padding:26px 26px 22px; box-shadow:var(--shadow); }
  .modal h3{ font-size:19px; margin-bottom:18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }

  .banner{ display:flex; gap:10px; align-items:flex-start; background:var(--amber-tint); color:var(--amber); border:1px solid color-mix(in srgb, var(--amber) 35%, transparent); border-radius:9px; padding:11px 14px; font-size:13px; margin-bottom:18px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px; }
  .stat{ padding:14px 16px; }
  .stat .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--sage); }
  .stat .value{ font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; margin-top:5px; }

  .lists-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .list-add{ display:flex; gap:8px; margin-bottom:12px; }
  .simple-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; max-height:420px; overflow-y:auto; }
  .simple-list li{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .simple-list li:last-child{ border-bottom:none; }
  .simple-list .nm.inactivo{ color:var(--ink-soft); text-decoration:line-through; }

  /* ---- Mapa ---- */
  .mapa-layout{ display:flex; gap:16px; align-items:flex-start; }
  .mapa-plan-col{ flex:0 0 50%; min-width:0; }
  .mapa-detail-col{ flex:1; min-width:0; }
  .plan-tabs{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; margin-bottom:10px; }
  .plan-tabs button{ flex:1; border:none; background:transparent; padding:7px 8px; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; }
  .plan-tabs button.active{ background:var(--clay); color:#fffaf3; }
  .plan-scroll{ overflow:auto; border-radius:10px; border:1px solid var(--border); background:var(--surface-sunken); max-height:70vh; }
  .plan-container{ position:relative; display:inline-block; min-width:100%; }
  .plan-img{ display:block; width:100%; height:auto; }
  .hs{ position:absolute; border:1.5px solid rgba(255,255,255,.7); border-radius:4px; background:rgba(181,96,47,.28); cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono"; font-size:9px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .hs:hover{ background:rgba(181,96,47,.65); border-color:#fff; z-index:2; }
  .hs.ocupado{ background:rgba(76,122,79,.45); border-color:rgba(76,122,79,.9); }
  .hs.ocupado:hover{ background:rgba(76,122,79,.75); }
  .hs.sel{ border-width:2.5px; border-color:#fff; z-index:3; box-shadow:0 0 0 2px var(--clay); }
  .hs-badge{ position:absolute; top:-6px; right:-6px; min-width:14px; height:14px; border-radius:7px; background:var(--green); border:1.5px solid var(--surface); font-size:8px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .mapa-toolrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .unit-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; min-height:260px; text-align:center; color:var(--ink-soft); gap:6px; padding:24px; }
  .unit-hd{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .unit-title{ font-size:26px; }
  .unit-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .unit-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .unit-worker{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 12px; box-shadow:var(--shadow); }
  .unit-worker .who{ font-weight:500; font-size:13.5px; }
  .unit-worker .what{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .addworker-form{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .ugrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; }
  .ubtn{ position:relative; background:var(--surface-sunken); border:1.5px solid var(--border); color:var(--ink); border-radius:6px; padding:8px 5px; font-family:"IBM Plex Mono"; font-size:11px; font-weight:500; cursor:pointer; text-align:center; }
  .ubtn:hover{ border-color:var(--clay); background:var(--clay-tint); color:var(--clay-dark); }
  .ubtn.ocupado{ border-color:var(--green); }
  .ubadge{ position:absolute; top:-6px; right:-6px; min-width:14px; height:14px; border-radius:7px; background:var(--green); color:#fff; font-size:8px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .frente-hd{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--sage); margin:14px 0 6px; }
  .frente-hd:first-child{ margin-top:0; }
  @media (max-width: 900px){ .mapa-layout{ flex-direction:column; } .mapa-plan-col{ flex:0 0 auto; width:100%; } .plan-scroll{ max-height:60vw; } }

  @media (max-width: 760px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ flex-direction:row; align-items:center; overflow-x:auto; padding:14px 16px; gap:16px; }
    .brand{ display:none; }
    nav{ flex-direction:row; }
    .sidebar-foot{ display:none; }
    main{ padding:18px 14px 40px; }
    .field-row{ grid-template-columns:1fr; }
    .lists-grid{ grid-template-columns:1fr; }
  }

  /* Inicio de sesión */
  body.auth-pending .app{ display:none; }
  .login-screen{ min-height:100vh; display:none; align-items:center; justify-content:center; padding:24px 16px; }
  body.auth-pending .login-screen{ display:flex; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:28px 26px; }
  .login-card .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--sage); }
  .login-card h1{ font-size:22px; margin:2px 0 6px; }
  .login-card p.sub{ color:var(--ink-soft); font-size:13px; margin:0 0 18px; }
  .login-card .field{ margin-bottom:12px; }
  .login-card input{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--parchment); }
  .login-card .btn{ width:100%; justify-content:center; padding:10px 14px; margin-top:4px; }
  .login-card .btn:disabled{ opacity:.6; cursor:wait; }
  .login-msg{ font-size:12.5px; margin-top:12px; min-height:18px; }
  .login-msg.err{ color:var(--rose); }
  .login-msg.ok{ color:var(--green); }
  .linkbtn{ background:none; border:none; padding:0; color:var(--clay-dark); cursor:pointer; font-size:12.5px; text-decoration:underline; margin-top:14px; }
  .userbox{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--ink-soft); }
  .userbox span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .userbox button{ flex:none; border:1px solid var(--border); background:var(--surface); border-radius:6px; padding:4px 8px; font-size:11.5px; cursor:pointer; color:var(--ink); }
</style>
</head>
<body class="auth-pending">

<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="eyebrow">Parque Tempisque</div>
    <h1>Asignación de Campo</h1>
    <p class="sub">Ingrese con el correo y la contraseña que le asignaron.</p>
    <div class="field"><label for="login-email">Correo</label><input type="email" id="login-email" autocomplete="username" required></div>
    <div class="field"><label for="login-pass">Contraseña</label><input type="password" id="login-pass" autocomplete="current-password" required></div>
    <button type="submit" class="btn" id="login-btn">Entrar</button>
    <div class="login-msg" id="login-msg" role="status"></div>
    <button type="button" class="linkbtn" id="login-reset">¿Olvidó su contraseña?</button>
  </form>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="eyebrow">Parque Tempisque</div><h1>Asignación de Campo</h1></div>
    <nav id="nav">
      <button class="navbtn active" data-tab="asignar"><span class="dot"></span>Asignar</button>
      <button class="navbtn" data-tab="mapa"><span class="dot"></span>Mapa</button>
      <button class="navbtn" data-tab="resumen"><span class="dot"></span>Resumen</button>
      <button class="navbtn" data-tab="colaboradores"><span class="dot"></span>Colaboradores</button>
      <button class="navbtn" data-tab="listas"><span class="dot"></span>Proyectos / Códigos</button>
    </nav>
    <button class="btn secondary" id="btn-exportar-excel" style="margin-top:auto;width:100%;justify-content:center">⬇ Exportar Excel</button>
    <div class="userbox"><span id="user-email"></span><button type="button" id="btn-logout">Salir</button></div>
    <div class="sidebar-foot" id="connStatus">Conectando…</div>
  </aside>

  <main>
    <div id="banner-slot"></div>
    <section id="view-asignar"></section>
    <section id="view-mapa" style="display:none"></section>
    <section id="view-resumen" style="display:none"></section>
    <section id="view-colaboradores" style="display:none"></section>
    <section id="view-listas" style="display:none"></section>
  </main>
</div>

<div id="modal-slot"></div>

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function pad(n){ return n<10?"0"+n:""+n; }
  function fmtDate(s){ if(!s) return "—"; var p=s.split("-"); return p[2]+"/"+p[1]; }
  function quincenaInicio(){ var d=new Date(); var dia = d.getDate()<=15 ? 1 : 16; return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(dia); }
  function quincenaFin(){ var d=new Date(); var fin = d.getDate()<=15 ? 15 : new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(fin); }
  function codigoLabel(k){ var c = CODIGOS_AUSENCIA.find(function(x){ return x.key===k; }); return c ? c.label : k; }
  function proyectoNombre(id){ var p = state.proyectos.find(function(x){ return x.id===id; }); return p ? p.nombre : ""; }
  function codigosParaProyecto(proyectoId){
    var specific = state.codigosPresupuestarios.filter(function(c){ return c.alcance===proyectoId && c.activo!==false; });
    var list = specific.length ? specific : state.codigosPresupuestarios.filter(function(c){ return c.alcance==="default" && c.activo!==false; });
    return list.slice().sort(function(a,b){ return (a.descripcion||"").localeCompare(b.descripcion||""); });
  }
  function proyectoOptionsHtml(selectedId){
    var proyectosActivos = state.proyectos.filter(function(p){ return p.activo!==false; }).slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
    return '<option value="">— sin asignar —</option>' + proyectosActivos.map(function(p){
      return '<option value="'+esc(p.id)+'" '+(p.id===selectedId?"selected":"")+'>'+esc(p.nombre)+'</option>';
    }).join("");
  }
  function actividadOptionsHtml(proyectoId, selectedCodigo){
    if(!proyectoId) return '<option value="">— elige un proyecto primero —</option>';
    var list = codigosParaProyecto(proyectoId);
    if(!list.length) return '<option value="">— sin códigos disponibles —</option>';
    return '<option value="">— seleccionar —</option>' + list.map(function(c){
      return '<option value="'+esc(c.id)+'" '+(c.id===selectedCodigo?"selected":"")+'>'+esc(c.codigo)+' — '+esc(c.descripcion)+'</option>';
    }).join("");
  }

  function boot(){
    if(typeof FIREBASE_CONFIG === "undefined" || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PEGA_")===0){
      document.body.classList.remove("auth-pending");
      onDbUnavailable("Falta configurar Firebase: edita firebase-config.js con los datos de tu proyecto (ver README).");
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){
      document.body.classList.remove("auth-pending");
      onDbUnavailable("No se pudo conectar a Firebase: "+e.message);
      return;
    }
    initLogin();
    var suscrito = false;
    firebase.auth().onAuthStateChanged(function(user){
      if(!user){
        document.body.classList.add("auth-pending");
        if(suscrito) location.reload(); // al cerrar sesión: cortar todos los listeners
        return;
      }
      document.body.classList.remove("auth-pending");
      document.getElementById("user-email").textContent = user.email || "";
      if(suscrito) return;
      suscrito = true;
      state.dbReady = true;
      document.getElementById("connStatus").textContent = "Conectado · datos en vivo";
      subscribeColaboradores();
      subscribeProyectos();
      subscribeCodigosPresupuestarios();
      subscribeAsignacionesDia();
      subscribeAsignacionesResumen();
    });
  }
  function mensajeAuth(e){
    var c = (e && e.code) || "";
    if(c==="auth/invalid-credential" || c==="auth/wrong-password" || c==="auth/user-not-found" || c==="auth/invalid-login-credentials") return "Correo o contraseña incorrectos.";
    if(c==="auth/invalid-email") return "El correo no es válido.";
    if(c==="auth/user-disabled") return "Esta cuenta está desactivada. Consulte con el administrador.";
    if(c==="auth/too-many-requests") return "Demasiados intentos. Espere unos minutos e intente de nuevo.";
    if(c==="auth/network-request-failed") return "Sin conexión a internet.";
    if(c==="auth/operation-not-allowed" || c==="auth/configuration-not-found") return "El inicio de sesión aún no está habilitado en Firebase.";
    return "No se pudo iniciar sesión" + (c ? " ("+c+")" : "") + ".";
  }
  function initLogin(){
    var form = document.getElementById("login-form");
    var msg = document.getElementById("login-msg");
    var btn = document.getElementById("login-btn");
    function setMsg(texto, tipo){ msg.textContent = texto; msg.className = "login-msg" + (tipo ? " "+tipo : ""); }
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      var pass = document.getElementById("login-pass").value;
      btn.disabled = true; setMsg("Ingresando…");
      firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(function(){ setMsg(""); document.getElementById("login-pass").value = ""; })
        .catch(function(err){ setMsg(mensajeAuth(err), "err"); })
        .then(function(){ btn.disabled = false; });
    });
    document.getElementById("login-reset").addEventListener("click", function(){
      var email = document.getElementById("login-email").value.trim();
      if(!email){ setMsg("Escriba su correo arriba y vuelva a presionar este enlace.", "err"); return; }
      firebase.auth().sendPasswordResetEmail(email)
        .then(function(){ setMsg("Si el correo tiene cuenta, le llegará un enlace para cambiar la contraseña.", "ok"); })
        .catch(function(err){ setMsg(mensajeAuth(err), "err"); });
    });
    document.getElementById("btn-logout").addEventListener("click", function(){
      if(confirm("¿Cerrar sesión?")) firebase.auth().signOut();
    });
  }
  function onDbUnavailable(msg){
    state.dbReady = false;
    document.getElementById("connStatus").textContent = "Sin conexión a datos";
    window.__dbErrorMsg = msg || "";
    renderAll();
  }
  function renderBanner(){
    document.getElementById("banner-slot").innerHTML = (state.dbReady === false)

      : "";
  }

  function subscribeColaboradores(){
    db.collection("colaboradores").orderBy("nombre","asc").onSnapshot(function(snap){
      state.colaboradores = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(e){ console.error(e); });
  }
  function subscribeProyectos(){
    db.collection("proyectos").orderBy("nombre","asc").onSnapshot(function(snap){
      state.proyectos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(e){ console.error(e); });
  }
  function subscribeCodigosPresupuestarios(){
    db.collection("codigos_presupuestarios").onSnapshot(function(snap){
      state.codigosPresupuestarios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(e){ console.error(e); });
  }
  function subscribeAsignacionesDia(){
    db.collection("asignaciones").where("fecha","==",state.fecha).onSnapshot(function(snap){
      var byCol = {};
      snap.docs.forEach(function(d){ var data = d.data(); byCol[data.colaboradorId] = data; });
      state.asignacionesDia[state.fecha] = byCol;
      if(state.tab==="asignar") renderAsignar();
      if(state.tab==="mapa") renderMapa();
    }, function(e){ console.error(e); });
  }
  function subscribeAsignacionesResumen(){
    db.collection("asignaciones").where("fecha",">=",state.resumenDesde).where("fecha","<=",state.resumenHasta).onSnapshot(function(snap){
      var byCol = {};
      snap.docs.forEach(function(d){ var data = d.data(); (byCol[data.colaboradorId]=byCol[data.colaboradorId]||[]).push(data); });
      state.asignacionesResumen = byCol;
      if(state.tab==="resumen") renderResumen();
    }, function(e){ console.error(e); });
  }

  function styleHeaderRow(row){
    row.height = 20;
    row.eachCell(function(cell){
      cell.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FF7E3F1C"}};
      cell.font = {bold:true, color:{argb:"FFFFFFFF"}, size:10, name:"Calibri"};
      cell.alignment = {horizontal:"center", vertical:"middle"};
    });
  }
  function styleDataRows(ws){
    ws.eachRow({includeEmpty:false}, function(row, rowNumber){
      if(rowNumber===1) return;
      var bg = rowNumber%2===0 ? "FFF3EDE2" : "FFFFFFFF";
      row.eachCell({includeEmpty:true}, function(cell){
        cell.fill = {type:"pattern", pattern:"solid", fgColor:{argb:bg}};
        cell.font = cell.font && cell.font.bold ? cell.font : {size:10, name:"Calibri", color:{argb:"FF2C2620"}};
        cell.alignment = {vertical:"middle"};
        cell.border = {bottom:{style:"hair", color:{argb:"FFDDD0AF"}}};
      });
    });
  }
  function colaboradorNombrePorCasco(casco){
    var c = state.colaboradores.find(function(x){ return x.casco===casco; });
    return c ? c.nombre : casco;
  }

  async function exportarExcel(){
    var btn = document.getElementById("btn-exportar-excel");
    if(state.dbReady===false){ alert("Sin conexión al almacenamiento compartido; no se puede exportar."); return; }
    var textoOriginal = btn.textContent;
    btn.textContent = "Generando…"; btn.disabled = true;
    try{
      var snap = await db.collection("asignaciones").get();
      var asignaciones = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });

      var wb = new ExcelJS.Workbook();
      wb.creator = "Asignación de Campo PT";
      wb.created = new Date();

      var wsA = wb.addWorksheet("Asignaciones");
      wsA.columns = [
        {header:"Fecha", key:"fecha", width:12}, {header:"Casco", key:"casco", width:9},
        {header:"Colaborador", key:"nombre", width:32}, {header:"Ocupación", key:"ocupacion", width:20},
        {header:"Sitio", key:"sitio", width:11}, {header:"Casa/Unidad", key:"unidad", width:12},
        {header:"Tipo", key:"tipo", width:11}, {header:"Proyecto", key:"proyecto", width:34},
        {header:"Código actividad", key:"actCod", width:16}, {header:"Actividad", key:"actDesc", width:34},
        {header:"Código ausencia", key:"ausCod", width:14}, {header:"Detalle ausencia", key:"ausDesc", width:20},
        {header:"Nota", key:"nota", width:28}
      ];
      styleHeaderRow(wsA.getRow(1));
      asignaciones.slice().sort(function(a,b){
        if(a.fecha!==b.fecha) return a.fecha < b.fecha ? 1 : -1;
        return (colaboradorNombrePorCasco(a.colaboradorId)||"").localeCompare(colaboradorNombrePorCasco(b.colaboradorId)||"");
      }).forEach(function(a){
        var c = state.colaboradores.find(function(x){ return x.casco===a.colaboradorId; });
        wsA.addRow({
          fecha: a.fecha||"", casco: a.colaboradorId||"", nombre: c?c.nombre:"", ocupacion: c?(c.ocupacion||""):"",
          sitio: a.sitio||"", unidad: a.unidad ? displayUnidad(a.unidad) : "",
          tipo: a.tipo==="ausencia" ? "Ausencia" : "Trabajo",
          proyecto: a.proyecto||"", actCod: a.actividadCodigo||"", actDesc: a.actividad||"",
          ausCod: a.codigoAusencia||"", ausDesc: a.codigoAusencia ? codigoLabel(a.codigoAusencia) : "",
          nota: a.nota||""
        });
      });
      wsA.autoFilter = "A1:M1";
      wsA.views = [{state:"frozen", ySplit:1}];
      styleDataRows(wsA);

      var wsC = wb.addWorksheet("Colaboradores");
      wsC.columns = [
        {header:"Casco", key:"casco", width:9}, {header:"Nombre", key:"nombre", width:32},
        {header:"Ocupación", key:"ocupacion", width:20},
        {header:"Sitio", key:"sitio", width:12}, {header:"Activo", key:"activo", width:9}
      ];
      styleHeaderRow(wsC.getRow(1));
      state.colaboradores.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); }).forEach(function(c){
        wsC.addRow({casco:c.casco, nombre:c.nombre, ocupacion:c.ocupacion||"", sitio:c.sitio||"", activo: c.activo!==false?"Sí":"No"});
      });
      wsC.views = [{state:"frozen", ySplit:1}];
      styleDataRows(wsC);

      var wsP = wb.addWorksheet("Proyectos");
      wsP.columns = [
        {header:"Nombre", key:"nombre", width:38}, {header:"Código proyecto", key:"codigoProyecto", width:16},
        {header:"Activo", key:"activo", width:9}
      ];
      styleHeaderRow(wsP.getRow(1));
      state.proyectos.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); }).forEach(function(p){
        wsP.addRow({nombre:p.nombre, codigoProyecto:p.codigoProyecto||"", activo: p.activo!==false?"Sí":"No"});
      });
      wsP.views = [{state:"frozen", ySplit:1}];
      styleDataRows(wsP);

      var wsK = wb.addWorksheet("Codigos presupuestarios");
      wsK.columns = [
        {header:"Código", key:"codigo", width:16}, {header:"Descripción", key:"descripcion", width:42},
        {header:"Categoría", key:"categoria", width:18}, {header:"Alcance", key:"alcance", width:30},
        {header:"Activo", key:"activo", width:9}
      ];
      styleHeaderRow(wsK.getRow(1));
      state.codigosPresupuestarios.slice().sort(function(a,b){ return (a.codigo||"").localeCompare(b.codigo||""); }).forEach(function(k){
        wsK.addRow({
          codigo:k.codigo, descripcion:k.descripcion, categoria:k.categoria||"",
          alcance: k.alcance==="default" ? "Por defecto" : (proyectoNombre(k.alcance)||k.alcance),
          activo: k.activo!==false?"Sí":"No"
        });
      });
      wsK.views = [{state:"frozen", ySplit:1}];
      styleDataRows(wsK);

      var porColab = {};
      asignaciones.forEach(function(a){
        var key = a.colaboradorId;
        if(!porColab[key]) porColab[key] = {dias:0, ausencias:0, porCodigo:{}};
        if(a.tipo==="ausencia"){
          porColab[key].ausencias++;
          var k = a.codigoAusencia||"?";
          porColab[key].porCodigo[k] = (porColab[key].porCodigo[k]||0)+1;
        } else if(a.tipo==="trabajo"){
          porColab[key].dias++;
        }
      });
      var wsR = wb.addWorksheet("Resumen por colaborador");
      wsR.columns = [
        {header:"Casco", key:"casco", width:9}, {header:"Colaborador", key:"nombre", width:32},
        {header:"Días trabajados", key:"dias", width:16}, {header:"Ausencias", key:"ausencias", width:12},
        {header:"Detalle ausencias", key:"detalle", width:40}
      ];
      styleHeaderRow(wsR.getRow(1));
      Object.keys(porColab).map(function(casco){
        var c = state.colaboradores.find(function(x){ return x.casco===casco; });
        return {casco:casco, nombre: c?c.nombre:casco, datos:porColab[casco]};
      }).sort(function(a,b){ return a.nombre.localeCompare(b.nombre); }).forEach(function(item){
        var detalle = Object.keys(item.datos.porCodigo).map(function(k){ return codigoLabel(k)+": "+item.datos.porCodigo[k]; }).join(", ");
        wsR.addRow({casco:item.casco, nombre:item.nombre, dias:item.datos.dias, ausencias:item.datos.ausencias, detalle:detalle});
      });
      wsR.views = [{state:"frozen", ySplit:1}];
      styleDataRows(wsR);

      var buffer = await wb.xlsx.writeBuffer();
      var blob = new Blob([buffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      var url = URL.createObjectURL(blob);
      var a2 = document.createElement("a");
      a2.href = url; a2.download = "Asignacion_Campo_PT_"+todayStr()+".xlsx";
      document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }catch(e){
      console.error(e);
      alert("Error al exportar: "+e.message);
    } finally {
      btn.textContent = textoOriginal; btn.disabled = false;
    }
  }

  function saveAsignacion(casco, tr){
    if(state.dbReady===false) return;
    var tipo = tr.querySelector(".tipo-sel").value;
    var proyectoId = tr.querySelector(".proyecto-sel").value;
    var actividadId = tr.querySelector(".actividad-sel").value;
    var codigoInfo = state.codigosPresupuestarios.find(function(x){ return x.id===actividadId; });
    var existente = (state.asignacionesDia[state.fecha] || {})[casco] || {};
    var data = {
      colaboradorId: casco,
      fecha: state.fecha,
      sitio: state.sitioActivo,
      tipo: tipo,
      unidad: tipo==="trabajo" ? (existente.unidad || "") : "",
      proyectoId: tipo==="trabajo" ? proyectoId : "",
      proyecto: tipo==="trabajo" ? proyectoNombre(proyectoId) : "",
      actividadCodigoId: tipo==="trabajo" ? actividadId : "",
      actividadCodigo: tipo==="trabajo" && codigoInfo ? codigoInfo.codigo : "",
      actividad: tipo==="trabajo" && codigoInfo ? codigoInfo.descripcion : "",
      codigoAusencia: tipo==="ausencia" ? tr.querySelector(".codigo-sel").value : "",
      nota: tr.querySelector(".nota-in").value.trim()
    };
    db.collection("asignaciones").doc(casco+"__"+state.fecha).set(data)
      .catch(function(err){ alert("No se pudo guardar: "+err.message); });
  }

  // =========================================================
  // MAPA (asignación por casa/unidad — La Pampa y Los Parques)
  // =========================================================
  function displayUnidad(u){ return u.indexOf("LP")===0 ? u.slice(2) : u; }
  function sugerirProyectoPorUnidad(unidad){
    var activos = state.proyectos.filter(function(p){ return p.activo!==false; });
    var u = unidad.toLowerCase();
    var directo = activos.find(function(p){ return p.nombre.toLowerCase()===u; });
    if(directo) return directo.id;
    var numero = displayUnidad(unidad);
    if(!/^[0-9]+$/.test(numero)){
      // Unidades con nombre (ej. "Club House"): proyecto cuyo nombre la contiene
      var contiene = activos.find(function(p){ return p.nombre.toLowerCase().indexOf(u) >= 0; });
      return contiene ? contiene.id : "";
    }
    var match = activos.find(function(p){
      var tokens = p.nombre.split(/[^0-9A-Za-z]+/);
      return tokens.indexOf(numero) >= 0;
    });
    return match ? match.id : "";
  }
  function asignacionesPorUnidad(){
    var registros = state.asignacionesDia[state.fecha] || {};
    var porUnidad = {};
    Object.keys(registros).forEach(function(casco){
      var r = registros[casco];
      if(!r.unidad) return;
      (porUnidad[r.unidad] = porUnidad[r.unidad] || []).push(Object.assign({casco:casco}, r));
    });
    return porUnidad;
  }

  function colabOptionsFiltradas(filtro){
    var f = (filtro||"").trim().toLowerCase();
    var lista = state.colaboradores.filter(function(c){ return c.activo!==false; });
    if(f){
      lista = lista.filter(function(c){
        return String(c.casco).toLowerCase().indexOf(f)>=0 || c.nombre.toLowerCase().indexOf(f)>=0;
      });
    }
    lista = lista.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
    if(!lista.length) return '<option value="">— sin resultados —</option>';
    return '<option value="">— elegir colaborador ('+lista.length+') —</option>' +
      lista.map(function(c){ return '<option value="'+esc(c.casco)+'">#'+esc(c.casco)+' — '+esc(c.nombre)+'</option>'; }).join("");
  }

  function bindUnidadDetalleEvents(){
    if(!state.mapaUnidad) return;
    var proySel = document.getElementById("mapa-proy-sel");
    var actSel = document.getElementById("mapa-act-sel");
    if(proySel) proySel.addEventListener("change", function(){ actSel.innerHTML = actividadOptionsHtml(proySel.value, ""); });

    var colabBuscar = document.getElementById("mapa-colab-buscar");
    var colabSel = document.getElementById("mapa-colab-sel");
    if(colabBuscar) colabBuscar.addEventListener("input", function(){
      state.mapaColabFiltro = colabBuscar.value;
      colabSel.innerHTML = colabOptionsFiltradas(state.mapaColabFiltro);
    });

    document.querySelectorAll("[data-quitar]").forEach(function(b){
      b.addEventListener("click", function(){
        if(!confirm("¿Quitar esta asignación de la casa?")) return;
        quitarDeUnidad(b.getAttribute("data-quitar"));
      });
    });

    var addBtn = document.getElementById("btn-agregar-a-unidad");
    if(addBtn) addBtn.addEventListener("click", function(){
      var casco = document.getElementById("mapa-colab-sel").value;
      if(!casco){ alert("Elige un colaborador."); return; }
      agregarAUnidad(casco, state.mapaUnidad,
        document.getElementById("mapa-proy-sel").value,
        document.getElementById("mapa-act-sel").value);
    });
  }

  function agregarAUnidad(casco, unidad, proyectoId, actividadId){
    if(state.dbReady===false) return;
    var ref = db.collection("asignaciones").doc(casco+"__"+state.fecha);
    var codigoInfo = state.codigosPresupuestarios.find(function(x){ return x.id===actividadId; });
    ref.get().then(function(snap){
      var base = snap.exists ? snap.data() : {};
      var data = Object.assign({}, base, {
        colaboradorId: casco,
        fecha: state.fecha,
        sitio: ALL_LOSP[unidad] ? "Parques" : "La Pampa",
        tipo: "trabajo",
        unidad: unidad,
        proyectoId: proyectoId || base.proyectoId || "",
        proyecto: proyectoId ? proyectoNombre(proyectoId) : (base.proyecto||""),
        actividadCodigoId: actividadId || "",
        actividadCodigo: codigoInfo ? codigoInfo.codigo : "",
        actividad: codigoInfo ? codigoInfo.descripcion : ""
      });
      return ref.set(data);
    }).then(function(){ state.mapaColabFiltro = ""; renderMapa(); })
      .catch(function(err){ alert("No se pudo guardar: "+err.message); });
  }

  function quitarDeUnidad(casco){
    if(state.dbReady===false) return;
    var ref = db.collection("asignaciones").doc(casco+"__"+state.fecha);
    ref.get().then(function(snap){
      if(!snap.exists) return;
      var data = Object.assign({}, snap.data());
      delete data.unidad;
      return ref.set(data);
    }).then(function(){ renderMapa(); })
      .catch(function(err){ alert("No se pudo actualizar: "+err.message); });
  }

  function openBuildingPicker(bk, porUnidad){
    var units = BUILDING_UNITS[bk] || [];
    var grid = units.map(function(u){
      var ocupado = (porUnidad[u]||[]).length;
      return '<button type="button" class="ubtn'+(ocupado?" ocupado":"")+'" data-u="'+esc(u)+'">'+esc(u)+(ocupado?'<span class="ubadge">'+ocupado+'</span>':'')+'</button>';
    }).join("");
    var html = '<div class="modal-backdrop" id="modal-backdrop"><div class="modal" style="max-width:380px">'+
      '<h3>'+esc(bk)+' — unidades</h3>'+
      '<div class="ugrid">'+grid+'</div>'+
      '<div class="modal-actions"><button type="button" class="btn secondary" id="modal-cancel">Cerrar</button></div>'+
    '</div></div>';
    document.getElementById("modal-slot").innerHTML = html;
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", function(e){ if(e.target.id==="modal-backdrop") closeModal(); });
    document.querySelectorAll("#modal-slot [data-u]").forEach(function(b){
      b.addEventListener("click", function(){ seleccionarUnidad(b.getAttribute("data-u")); });
    });
  }

  function openUnidadPicker(porUnidad){
    var groupsHtml = UNIDAD_GROUPS.map(function(g){
      var items = g.units.map(function(u){
        var ocupado = (porUnidad[u]||[]).length;
        return '<button type="button" class="ubtn'+(ocupado?" ocupado":"")+'" data-u="'+esc(u)+'">'+esc(displayUnidad(u))+(ocupado?'<span class="ubadge">'+ocupado+'</span>':'')+'</button>';
      }).join("");
      return '<div class="frente-hd">'+esc(g.label)+'</div><div class="ugrid">'+items+'</div>';
    }).join("");
    var html = '<div class="modal-backdrop" id="modal-backdrop"><div class="modal" style="max-width:560px;max-height:80vh;overflow-y:auto">'+
      '<h3>Buscar unidad</h3>'+groupsHtml+
      '<div class="modal-actions"><button type="button" class="btn secondary" id="modal-cancel">Cerrar</button></div>'+
    '</div></div>';
    document.getElementById("modal-slot").innerHTML = html;
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", function(e){ if(e.target.id==="modal-backdrop") closeModal(); });
    document.querySelectorAll("#modal-slot [data-u]").forEach(function(b){
      b.addEventListener("click", function(){ seleccionarUnidad(b.getAttribute("data-u")); });
    });
  }

  // =========================================================
  // RESUMEN
  // =========================================================
  function renderResumen(){
    var el = document.getElementById("view-resumen");
    var colabs = state.colaboradores.filter(function(c){ return c.activo!==false && (c.sitio||"La Pampa")===state.sitioActivo; });

    var totalTrabajados = 0, totalAusencias = 0;
    var filas = colabs.map(function(c){
      var regs = (state.asignacionesResumen[c.casco]||[]).filter(function(r){ return r.sitio===state.sitioActivo || !r.sitio; });
      var dias = regs.filter(function(r){ return r.tipo!=="ausencia"; }).length;
      var ausRegs = regs.filter(function(r){ return r.tipo==="ausencia"; });
      var porCodigo = {};
      ausRegs.forEach(function(r){ porCodigo[r.codigoAusencia] = (porCodigo[r.codigoAusencia]||0)+1; });
      var codigosTxt = Object.keys(porCodigo).map(function(k){ return (k||"?")+':'+porCodigo[k]; }).join(", ");

      totalTrabajados += dias;
      totalAusencias += ausRegs.length;

      return '<tr>'+
        '<td class="name-cell">'+esc(c.nombre)+' <span class="casco-chip">#'+esc(c.casco)+'</span></td>'+
        '<td class="mono">'+dias+'</td>'+
        '<td>'+(ausRegs.length ? '<span class="pill amber">'+ausRegs.length+'</span> <span class="muted" style="font-size:12px">'+esc(codigosTxt)+'</span>' : '<span class="pill green">0</span>')+'</td>'+
      '</tr>';
    }).join("");

    el.innerHTML =
      '<div class="topbar"><div><h2>Resumen del período</h2><div class="sub">Días trabajados y ausencias por colaborador</div></div></div>'+
      '<div class="toolrow">'+siteTabsHtml()+
        '<label>Desde</label><input type="date" id="resumen-desde" value="'+state.resumenDesde+'">'+
        '<label>Hasta</label><input type="date" id="resumen-hasta" value="'+state.resumenHasta+'">'+
      '</div>'+
      '<div class="stat-row">'+
        '<div class="card stat"><div class="label">Colaboradores</div><div class="value">'+colabs.length+'</div></div>'+
        '<div class="card stat"><div class="label">Días trabajados (suma)</div><div class="value">'+totalTrabajados+'</div></div>'+
        '<div class="card stat"><div class="label">Ausencias (suma)</div><div class="value">'+totalAusencias+'</div></div>'+
      '</div>'+
      (colabs.length===0 ?
        '<div class="card empty"><h3>Sin colaboradores en este sitio</h3></div>' :
        '<div class="card table-wrap"><table><thead><tr><th>Colaborador</th><th>Días trabajados</th><th>Ausencias</th></tr></thead><tbody>'+filas+'</tbody></table></div>');

    bindSiteTabs(el, renderResumen);
    document.getElementById("resumen-desde").addEventListener("change", function(e){ state.resumenDesde = e.target.value; subscribeAsignacionesResumen(); renderResumen(); });
    document.getElementById("resumen-hasta").addEventListener("change", function(e){ state.resumenHasta = e.target.value; subscribeAsignacionesResumen(); renderResumen(); });
  }

  // =========================================================
  // COLABORADORES
  // =========================================================
  function renderColaboradores(){
    var el = document.getElementById("view-colaboradores");
    var filtro = state.filtroColab || "";
    var lista = state.colaboradores.filter(function(c){ return !filtro || c.nombre.toLowerCase().indexOf(filtro.toLowerCase())>=0; });
    var rows = lista.map(function(c){
      return '<tr>'+
        '<td class="casco-chip">#'+esc(c.casco)+'</td>'+
        '<td class="name-cell">'+esc(c.nombre)+(c.activo===false?' <span class="pill idle">inactivo</span>':'')+'</td>'+
        '<td class="muted">'+esc(c.ocupacion||"—")+'</td>'+
        '<td>'+esc(c.sitio||"La Pampa")+'</td>'+
        '<td><button class="btn secondary small" data-edit="'+c.id+'">Editar</button> <button class="btn danger small" data-del="'+c.id+'">Eliminar</button></td>'+
      '</tr>';
    }).join("");

    el.innerHTML =
      '<div class="topbar"><div><h2>Colaboradores</h2><div class="sub">'+state.colaboradores.length+' registrados</div></div>'+
        '<button class="btn" id="btn-nuevo-colab" '+(state.dbReady===false?'disabled':'')+'>+ Agregar</button></div>'+
      '<div class="toolrow"><input type="text" class="search-box" id="buscar-colab-tab" placeholder="Buscar por nombre…" value="'+esc(filtro)+'"></div>'+
      (state.colaboradores.length===0 ?
        '<div class="card empty"><h3>Aún no hay colaboradores</h3></div>' :
        '<div class="card table-wrap"><table><thead><tr><th>Casco</th><th>Nombre</th><th>Ocupación</th><th>Sitio</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>');

    document.getElementById("btn-nuevo-colab").addEventListener("click", function(){ openColabModal(null); });
    document.getElementById("buscar-colab-tab").addEventListener("input", function(e){ state.filtroColab = e.target.value; renderColaboradores(); });
    el.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ openColabModal(b.getAttribute("data-edit")); }); });
    el.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){
      var c = state.colaboradores.find(function(x){ return x.id===b.getAttribute("data-del"); });
      if(!c) return;
      if(!confirm('Eliminar a "'+c.nombre+'"? Las asignaciones ya registradas conservarán la referencia.')) return;
      db.collection("colaboradores").doc(c.id).delete().catch(function(err){ alert("No se pudo eliminar: "+err.message); });
    }); });
  }

  function openColabModal(id){
    var c = id ? state.colaboradores.find(function(x){ return x.id===id; }) : null;
    var v = c || { casco:"", nombre:"", ocupacion:"", sitio:"La Pampa", activo:true };
    var sitioOpts = SITIOS.map(function(s){ return '<option '+(v.sitio===s?"selected":"")+'>'+s+'</option>'; }).join("");
    var html =
      '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">'+
        '<h3>'+(c?"Editar colaborador":"Nuevo colaborador")+'</h3>'+
        '<form id="colab-form">'+
          '<div class="field-row">'+
            '<div class="field"><label>Casco / ID</label><input type="text" name="casco" required value="'+esc(v.casco)+'" '+(c?"readonly":"")+'></div>'+
            '<div class="field"><label>Sitio</label><select name="sitio">'+sitioOpts+'</select></div>'+
          '</div>'+
          '<div class="field"><label>Nombre completo</label><input type="text" name="nombre" required value="'+esc(v.nombre)+'"></div>'+
          '<div class="field"><label>Ocupación</label><input type="text" name="ocupacion" value="'+esc(v.ocupacion)+'"></div>'+
          '<div class="checkbox-row"><input type="checkbox" name="activo" id="chk-activo-colab" '+(v.activo!==false?"checked":"")+'><label for="chk-activo-colab" style="margin:0">Activo</label></div>'+
          '<div class="modal-actions">'+
            '<button type="button" class="btn secondary" id="modal-cancel">Cancelar</button>'+
            '<button type="submit" class="btn">Guardar</button>'+
          '</div>'+
        '</form>'+
      '</div></div>';
    document.getElementById("modal-slot").innerHTML = html;
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", function(e){ if(e.target.id==="modal-backdrop") closeModal(); });
    document.getElementById("colab-form").addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var casco = (fd.get("casco")||"").trim();
      if(!casco) return;
      var data = {
        casco: casco,
        nombre: (fd.get("nombre")||"").trim(),
        ocupacion: (fd.get("ocupacion")||"").trim(),
        sitio: fd.get("sitio")||"La Pampa",
        activo: fd.get("activo")==="on"
      };
      if(!data.nombre) return;
      db.collection("colaboradores").doc(casco).set(data).then(closeModal).catch(function(err){ alert("No se pudo guardar: "+err.message); });
    });
  }
  function closeModal(){ document.getElementById("modal-slot").innerHTML = ""; }

  // =========================================================
  // LISTAS (proyectos / códigos presupuestarios)
  // =========================================================
  function renderListas(){
    var el = document.getElementById("view-listas");
    var proyectosTodos = state.proyectos.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });

    function proyectoItemsHtml(){
      return proyectosTodos.map(function(x){
        return '<li><span class="nm '+(x.activo===false?"inactivo":"")+'">'+esc(x.nombre)+(x.codigoProyecto?' <span class="muted mono" style="font-size:11px">'+esc(x.codigoProyecto)+'</span>':'')+'</span>'+
          '<span><button class="btn secondary small" data-toggle-proy="'+x.id+'">'+(x.activo===false?"Reactivar":"Desactivar")+'</button> '+
          '<button class="btn danger small" data-del-proy="'+x.id+'">Eliminar</button></span></li>';
      }).join("");
    }

    var codigosOrdenados = state.codigosPresupuestarios.slice().sort(function(a,b){
      var la = a.alcance==="default" ? "" : proyectoNombre(a.alcance);
      var lb = b.alcance==="default" ? "" : proyectoNombre(b.alcance);
      if(la!==lb) return la.localeCompare(lb);
      return (a.codigo||"").localeCompare(b.codigo||"");
    });
    function codigoItemsHtml(){
      return codigosOrdenados.map(function(x){
        var alcanceTxt = x.alcance==="default" ? "Por defecto" : (proyectoNombre(x.alcance) || x.alcance);
        return '<li><span class="nm '+(x.activo===false?"inactivo":"")+'"><span class="mono">'+esc(x.codigo)+'</span> — '+esc(x.descripcion)+
          '<div class="muted" style="font-size:11px">'+esc(alcanceTxt)+' · '+esc(x.categoria||"")+'</div></span>'+
          '<span><button class="btn secondary small" data-toggle-cod="'+x.id+'">'+(x.activo===false?"Reactivar":"Desactivar")+'</button> '+
          '<button class="btn danger small" data-del-cod="'+x.id+'">Eliminar</button></span></li>';
      }).join("");
    }
    var alcanceOpts = '<option value="default">Por defecto (todos los proyectos sin detalle)</option>' +
      proyectosTodos.filter(function(p){ return p.activo!==false; }).map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.nombre)+'</option>'; }).join("");

    el.innerHTML =
      '<div class="topbar"><div><h2>Proyectos y códigos presupuestarios</h2><div class="sub">Catálogos usados al asignar la actividad diaria</div></div></div>'+
      '<div class="lists-grid">'+
        '<div class="card" style="padding:16px 18px"><h3 style="font-size:15px;margin-bottom:12px">Proyectos ('+proyectosTodos.length+')</h3>'+
          '<div class="list-add"><input type="text" id="nuevo-proyecto" placeholder="Nuevo proyecto…"><button class="btn small" id="add-proyecto">Agregar</button></div>'+
          '<ul class="simple-list">'+proyectoItemsHtml()+'</ul>'+
        '</div>'+
        '<div class="card" style="padding:16px 18px"><h3 style="font-size:15px;margin-bottom:12px">Códigos presupuestarios ('+codigosOrdenados.length+')</h3>'+
          '<div class="field-row" style="margin-bottom:8px">'+
            '<input type="text" id="nuevo-cod-codigo" placeholder="Código">'+
            '<input type="text" id="nuevo-cod-desc" placeholder="Descripción">'+
          '</div>'+
          '<div class="list-add">'+
            '<select id="nuevo-cod-alcance" style="flex:1">'+alcanceOpts+'</select>'+
            '<button class="btn small" id="add-codigo">Agregar</button>'+
          '</div>'+
          '<ul class="simple-list">'+codigoItemsHtml()+'</ul>'+
        '</div>'+
      '</div>';

    document.getElementById("add-proyecto").addEventListener("click", function(){
      var inp = document.getElementById("nuevo-proyecto");
      var nombre = inp.value.trim();
      if(!nombre) return;
      db.collection("proyectos").add({nombre:nombre, activo:true}).then(function(){ inp.value=""; });
    });
    document.getElementById("add-codigo").addEventListener("click", function(){
      var codIn = document.getElementById("nuevo-cod-codigo");
      var descIn = document.getElementById("nuevo-cod-desc");
      var alcSel = document.getElementById("nuevo-cod-alcance");
      var codigo = codIn.value.trim(), descripcion = descIn.value.trim();
      if(!codigo || !descripcion) return;
      db.collection("codigos_presupuestarios").add({codigo:codigo, descripcion:descripcion, categoria:"Mano de Obra", alcance:alcSel.value, activo:true})
        .then(function(){ codIn.value=""; descIn.value=""; });
    });
    el.querySelectorAll("[data-toggle-proy]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-toggle-proy");
        var item = state.proyectos.find(function(x){ return x.id===id; });
        db.collection("proyectos").doc(id).update({activo: item.activo===false});
      });
    });
    el.querySelectorAll("[data-del-proy]").forEach(function(b){
      b.addEventListener("click", function(){
        if(!confirm("¿Eliminar este proyecto de la lista?")) return;
        db.collection("proyectos").doc(b.getAttribute("data-del-proy")).delete();
      });
    });
    el.querySelectorAll("[data-toggle-cod]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-toggle-cod");
        var item = state.codigosPresupuestarios.find(function(x){ return x.id===id; });
        db.collection("codigos_presupuestarios").doc(id).update({activo: item.activo===false});
      });
    });
    el.querySelectorAll("[data-del-cod]").forEach(function(b){
      b.addEventListener("click", function(){
        if(!confirm("¿Eliminar este código presupuestario?")) return;
        db.collection("codigos_presupuestarios").doc(b.getAttribute("data-del-cod")).delete();
      });
    });
  }

  boot();
  renderAll();
})();
</script>
</body>
</html>
